! Arista EOS Switch/Router 3
!
transceiver qsfp default-arm
!
hostname arista-r3
!
spanning-tree mode none
!
interface Loopback0
   ip address 3.3.3.3/32
!
interface Ethernet1
   description Link to Cisco IOS
   no shutdown
   ip address 10.0.12.2/30
   ip ospf area 0
!
interface Ethernet2
   description Link to Junos
   no shutdown
   ip address 10.0.23.1/30
   ip ospf area 0
!
interface Ethernet3
   description Link to Cisco IOS XR
   no shutdown
   ip address 10.0.34.1/30
   ip ospf area 0
!
router ospf 1
   router-id 3.3.3.3
   network 3.3.3.3/32 area 0
!
