!RANCID-CONTENT-TYPE: cisco-xr
!
hostname iosxr-r4
!
interface Loopback0
 description Router ID
 ipv4 address 4.4.4.4/32
!
interface GigabitEthernet0/0/0/0
 description Link to Arista EOS
 ipv4 address 10.0.34.2/30
 no shutdown
!
interface GigabitEthernet0/0/0/1
 description Link to FRRouting / SONiC
 ipv4 address 10.0.45.1/30
 no shutdown
!
router ospf 1
 router-id 4.4.4.4
 area 0
  interface Loopback0
   passive enable
  !
  interface GigabitEthernet0/0/0/0
   cost 10
  !
  interface GigabitEthernet0/0/0/1
   cost 10
  !
 !
!
