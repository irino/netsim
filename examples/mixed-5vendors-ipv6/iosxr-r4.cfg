!RANCID-CONTENT-TYPE: cisco-xr
!
hostname iosxr-r4
!
interface Loopback0
 description Router ID
 ipv6 address 2001:db8:4::1/128
!
interface GigabitEthernet0/0/0/0
 description Link to Arista EOS
 ipv6 address 2001:db8:34::2/64
 no shutdown
!
interface GigabitEthernet0/0/0/1
 description Link to FRRouting / SONiC
 ipv6 address 2001:db8:45::1/64
 no shutdown
!
router static
 address-family ipv6 unicast
  2001:db8:88::/64 2001:db8:45::2
 !
!
router ospfv3 1
 router-id 4.4.4.4
 area 0
  interface Loopback0
   passive enable
  !
  interface GigabitEthernet0/0/0/0
   cost 10
  !
  interface GigabitEthernet0/0/0/1
   cost 10
  !
 !
!
