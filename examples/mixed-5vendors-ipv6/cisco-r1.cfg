! Cisco IOS Router 1 (IPv6)
hostname cisco-r1
!
interface Loopback0
 ipv6 address 2001:db8:1::1/128
!
interface GigabitEthernet0/0
 description Link to Arista EOS
 ipv6 address 2001:db8:12::1/64
 ipv6 ospf 1 area 0
 no shutdown
!
interface GigabitEthernet0/1
 description Link to Junos
 ipv6 address 2001:db8:13::1/64
 ipv6 ospf 1 area 0
 no shutdown
!
ipv6 router ospf 1
 router-id 1.1.1.1
!
router bgp 65001
 bgp router-id 1.1.1.1
 neighbor 2001:db8:12::2 remote-as 65003
 address-family ipv6 unicast
  network 2001:db8:1::/64
 exit-address-family
!
