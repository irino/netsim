! Arista EOS Switch/Router 3 (IPv6)
!
transceiver qsfp default-arm
!
hostname arista-r3
!
spanning-tree mode none
!
interface Loopback0
   ipv6 address 2001:db8:3::1/128
!
interface Ethernet1
   description Link to Cisco IOS
   no shutdown
   ipv6 address 2001:db8:12::2/64
   ipv6 ospf 1 area 0
!
interface Ethernet2
   description Link to Junos
   no shutdown
   ipv6 address 2001:db8:23::1/64
   ipv6 ospf 1 area 0
!
interface Ethernet3
   description Link to Cisco IOS XR
   no shutdown
   ipv6 address 2001:db8:34::1/64
   ipv6 ospf 1 area 0
!
router ospf3 1
   router-id 3.3.3.3
!
router bgp 65003
   router-id 3.3.3.3
   neighbor 2001:db8:12::1 remote-as 65001
   address-family ipv6
      network 2001:db8:3::/64
   exit-address-family
!
